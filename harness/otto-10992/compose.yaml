services:
  ds-proxy:
    build:
      context: .
      dockerfile: harness/otto-10992/Dockerfile.proxy
    environment:
      TARGET_HOST: ds
      TARGET_PORT: 8791
      FAULT_MATCH: "${FAULT_MATCH:-}"
      DELAY_MS: "${DELAY_MS:-0}"
      HANG: "${HANG:-0}"
      OUTAGE: "${OUTAGE:-0}"
    ports:
      - "${PROXY_PORT:-8792}:8792"
    depends_on:
      ds:
        condition: service_healthy
  engine:
    environment:
      ELECTRIC_CIRCUITS_DS_URL: http://ds-proxy:8792
    depends_on:
      ds-proxy:
        condition: service_started
