services:
  ds-proxy:
    build:
      context: ..
      dockerfile: harness/otto-10992/Dockerfile.proxy
    environment:
      TARGET_HOST: ds
      TARGET_PORT: 8791
      FAULT_MATCH: "${FAULT_MATCH:-}"
      DELAY_MS: "${DELAY_MS:-0}"
      HANG: "${HANG:-0}"
      OUTAGE: "${OUTAGE:-0}"
      DS_STORE_ID: "${ELECTRIC_CIRCUITS_DS_STORE_ID:-2bc96d0b-9740-4f50-97c6-754b2b27d6b0}"
      DS_STORE_GENERATION: "${ELECTRIC_CIRCUITS_DS_STORE_GENERATION:-ff8b5fa6-e786-4994-8da0-f14e9e79f318}"
      DS_PROTOCOL_VERSION: "${ELECTRIC_CIRCUITS_DS_PROTOCOL_VERSION:-1}"
      DS_LAYOUT_VERSION: "${ELECTRIC_CIRCUITS_DS_LAYOUT_VERSION:-1}"
      DS_DURABILITY_MODE: "${ELECTRIC_CIRCUITS_DS_DURABILITY_MODE:-wal}"
      DS_WAL_SHARDS: "${ELECTRIC_CIRCUITS_DS_WAL_SHARDS:-2}"
      DS_STREAM_LANES: "${ELECTRIC_CIRCUITS_DS_STREAM_LANES:-1}"
      DS_FILESYSTEM_UUID: "${ELECTRIC_CIRCUITS_DS_FILESYSTEM_UUID:-253f14d5-cbee-4df8-9e3c-e44c6e41501b}"
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"
    ports:
      - "${PROXY_PORT:-8792}:8792"
    depends_on:
      ds:
        condition: service_healthy
  engine:
    environment:
      ELECTRIC_CIRCUITS_DS_URL: http://ds-proxy:8792
      ELECTRIC_CIRCUITS_DS_NAMESPACE: "${ELECTRIC_CIRCUITS_DS_NAMESPACE:-otto-10992}"
      ELECTRIC_CIRCUITS_DS_STORE_ID: "${ELECTRIC_CIRCUITS_DS_STORE_ID:-}"
      ELECTRIC_CIRCUITS_DS_STORE_GENERATION: "${ELECTRIC_CIRCUITS_DS_STORE_GENERATION:-}"
      ELECTRIC_CIRCUITS_DS_PROTOCOL_VERSION: "${ELECTRIC_CIRCUITS_DS_PROTOCOL_VERSION:-}"
      ELECTRIC_CIRCUITS_DS_LAYOUT_VERSION: "${ELECTRIC_CIRCUITS_DS_LAYOUT_VERSION:-}"
      ELECTRIC_CIRCUITS_DS_DURABILITY_MODE: "${ELECTRIC_CIRCUITS_DS_DURABILITY_MODE:-wal}"
      ELECTRIC_CIRCUITS_DS_WAL_SHARDS: "${ELECTRIC_CIRCUITS_DS_WAL_SHARDS:-1}"
      ELECTRIC_CIRCUITS_DS_STREAM_LANES: "${ELECTRIC_CIRCUITS_DS_STREAM_LANES:-1}"
      ELECTRIC_CIRCUITS_DS_FILESYSTEM_UUID: "${ELECTRIC_CIRCUITS_DS_FILESYSTEM_UUID:-}"
      ELECTRIC_CIRCUITS_QUERY_GENERATION: "${ELECTRIC_CIRCUITS_QUERY_GENERATION:-otto-10992}"
      ELECTRIC_CIRCUITS_INITIALIZE_NAMESPACE: "1"
    depends_on:
      ds-proxy:
        condition: service_started
