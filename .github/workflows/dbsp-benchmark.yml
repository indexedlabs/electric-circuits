name: dbsp spill benchmark

on:
  pull_request:
    paths:
      - 'apps/engine/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packages/bench/**'
      - 'scripts/dbsp-spill-benchmark.sh'
      - 'rust-toolchain.toml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Compare baseline and candidate sequentially
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
          BENCH_REPS: '5'
          BENCH_ARTIFACT_ROOT: ${{ github.workspace }}/.bench-artifacts
        run: ./scripts/dbsp-spill-benchmark.sh

      - name: Upload raw benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbsp-spill-comparison-${{ github.sha }}
          path: .bench-artifacts
          if-no-files-found: error
          retention-days: 30
