# Build + test on every push/PR: Rust engine unit tests, then the full TS suite (unit + the
# conformance harness, which boots its own ephemeral logical-replication Postgres — the runner
# image ships the PostgreSQL server binaries; they just need to be on PATH).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned to 1.96.0: stable 1.97.0 ICEs compiling dbsp 0.318.0 (rustc
      # next-trait-solver panic in structural_traits.rs). Keep in sync with
      # rust-toolchain.toml; do not float back to @stable until upstream is fixed.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          # `cargo fmt --check` below needs the component; the action installs none by default.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting (rustfmt.toml at the root)
        run: cargo fmt --check

      - name: Start isolated PostgreSQL 18 for Rust ownership tests
        run: |
          # Pin the ephemeral logical-replication harness to PostgreSQL 18; do not let the
          # runner's preinstalled major select the test boundary implicitly.
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          PGBIN="/usr/lib/postgresql/18/bin"
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/initdb" --version
          DATA="$RUNNER_TEMP/circuits-rust-pg"
          "$PGBIN/initdb" -D "$DATA" -U postgres --auth=trust --no-sync
          "$PGBIN/pg_ctl" -D "$DATA" -o "-p 55432 -c wal_level=logical -c unix_socket_directories=$RUNNER_TEMP" -w start
          echo 'ELECTRIC_CIRCUITS_TEST_PG_URL=postgres://postgres@127.0.0.1:55432/postgres' >> "$GITHUB_ENV"

      - name: Rust engine tests
        run: |
          cargo test -p electric-circuits-engine --features test-support
          cargo test -p electric-circuits-engine --test deployment_ownership -- --ignored
          cargo test -p electric-circuits-engine --features test-support --test sources_table -- --ignored
          # Same group contracts and binary; only membership selection changes.
          ELECTRIC_CIRCUITS_GROUP_MEMBERSHIP=semijoin \
            cargo test -p electric-circuits-engine --features test-support --test sources_table group_ -- --ignored
          # Projection restart/backfill and live INSERT/UPDATE/DELETE against a SQL oracle.
          cargo test -p electric-circuits-engine --features test-support --lib ingest_projection_real_postgres -- --ignored

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast: the vitest lane is esbuild (transpile-only) and sees no type errors at all.
      - name: Typecheck
        run: pnpm typecheck

      # `test:readiness-plan` is an explicit non-gating planner/provenance audit with a known-red
      # stale fixture. Do not silently fold it into this product gate or omit its classification.
      - name: Supported product Node test gate (including PostgreSQL 18 resolver)
        run: pnpm test:node

      - name: Full Vitest suite (including conformance)
        run: pnpm exec vitest run
        env:
          NODE_EXTRA_CA_CERTS: packages/conformance/test-pki/ca.pem
