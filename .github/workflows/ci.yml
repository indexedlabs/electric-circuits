# Build + test on every push/PR: Rust engine unit tests, then the full TS suite (unit + the
# conformance harness, which boots its own ephemeral logical-replication Postgres — the runner
# image ships the PostgreSQL server binaries; they just need to be on PATH).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned to 1.96.0: stable 1.97.0 ICEs compiling dbsp 0.318.0 (rustc
      # next-trait-solver panic in structural_traits.rs). Keep in sync with
      # rust-toolchain.toml; do not float back to @stable until upstream is fixed.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          # `cargo fmt --check` below needs the component; the action installs none by default.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting (rustfmt.toml at the root)
        id: format
        run: cargo fmt --check

      - name: Start isolated PostgreSQL 18 for Rust ownership tests
        id: pg18
        if: ${{ !cancelled() }}
        run: |
          # Pin the ephemeral logical-replication harness to PostgreSQL 18; do not let the
          # runner's preinstalled major select the test boundary implicitly.
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          PGBIN="/usr/lib/postgresql/18/bin"
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/initdb" --version
          DATA="$RUNNER_TEMP/circuits-rust-pg"
          "$PGBIN/initdb" -D "$DATA" -U postgres --auth=trust --no-sync
          "$PGBIN/pg_ctl" -D "$DATA" -o "-p 55432 -c wal_level=logical -c unix_socket_directories=$RUNNER_TEMP" -w start
          echo 'ELECTRIC_CIRCUITS_TEST_PG_URL=postgres://postgres@127.0.0.1:55432/postgres' >> "$GITHUB_ENV"

      - name: Group contracts in both membership modes
        if: ${{ !cancelled() && steps.pg18.outcome == 'success' }}
        run: |
          # Run both even when one mode fails: retain each first divergence.
          result=0
          for mode in subquery semijoin; do
            echo "Running group contracts with ELECTRIC_CIRCUITS_GROUP_MEMBERSHIP=$mode"
            # Temporary skip-only bisect: identify whether the red lane is the rollback
            # compensation contract while the hosted child log is unavailable.
            ELECTRIC_CIRCUITS_GROUP_MEMBERSHIP="$mode" \
              cargo test -p electric-circuits-engine --features test-support --test sources_table group_ -- \
                --ignored --nocapture --skip group_canceled_rollback_retains_unreleased_group_members || result=1
          done
          exit "$result"

      - name: Rollback compensation diagnostic
        if: ${{ !cancelled() && steps.pg18.outcome == 'success' }}
        run: |
          # Keep the bisect above, but run the excluded contract separately so its child
          # failure is visible as check-run annotations even when Actions log blobs are hidden.
          set -uo pipefail
          result=0
          for mode in subquery semijoin; do
            log="$RUNNER_TEMP/rollback-$mode.log"
            set +e
            ELECTRIC_CIRCUITS_GROUP_MEMBERSHIP="$mode" \
              cargo test -p electric-circuits-engine --features test-support --test sources_table \
                ownership::group_canceled_rollback_retains_unreleased_group_members -- \
                --exact --ignored --nocapture 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            while IFS= read -r line; do
              case "$line" in
                *"rollback cancellation"*|*"post-unsubscribe retry barrier"*|*"retry after rollback"*|*"contract ownership::group_canceled"*|*"test result:"*|*FAILED*)
                  safe=${line//'%'/'%25'}
                  safe=${safe//$'\r'/}
                  echo "::error title=$mode rollback diagnostic::$safe"
                  ;;
              esac
            done < "$log"
            if [ "$status" -ne 0 ]; then
              result=1
            fi
          done
          exit "$result"

      - name: Rust engine tests
        if: ${{ !cancelled() && steps.pg18.outcome == 'success' }}
        run: |
          # Preserve all results at red checkpoints. No failed command is waived:
          # the step still fails after every target has had a chance to execute.
          result=0
          cargo test -p electric-circuits-engine --features test-support --no-fail-fast || result=1
          cargo test -p electric-circuits-engine --test deployment_ownership -- --ignored || result=1
          cargo test -p electric-circuits-engine --features test-support --test sources_table -- --ignored || result=1
          # Projection restart/backfill and live INSERT/UPDATE/DELETE against a SQL oracle.
          cargo test -p electric-circuits-engine --features test-support --lib ingest_projection_real_postgres -- --ignored || result=1
          exit "$result"

      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        id: js
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      # Fail fast: the vitest lane is esbuild (transpile-only) and sees no type errors at all.
      - name: Typecheck
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: pnpm typecheck

      # `test:readiness-plan` is an explicit non-gating planner/provenance audit with a known-red
      # stale fixture. Do not silently fold it into this product gate or omit its classification.
      - name: Supported product Node test gate (including PostgreSQL 18 resolver)
        if: ${{ !cancelled() && steps.js.outcome == 'success' && steps.pg18.outcome == 'success' }}
        run: pnpm test:node

      - name: Full Vitest suite (including conformance)
        if: ${{ !cancelled() && steps.js.outcome == 'success' && steps.pg18.outcome == 'success' }}
        run: pnpm exec vitest run
        env:
          NODE_EXTRA_CA_CERTS: packages/conformance/test-pki/ca.pem

  # The prototype's only performance evidence: both membership implementations use the same
  # harness, seed, PostgreSQL 18 tools and five repetitions.  This is intentionally separate from
  # the correctness job so a benchmark failure cannot hide a regression result.  The JSON files
  # are the immutable inputs for the checked-in comparison report; modeled gateway charges remain
  # separate from the engine's provider-read counters.
  scope-benchmark:
    needs: test
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install PostgreSQL 18 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/postgresql-pgdg.list
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg postgresql-18 postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build benchmark engine
        run: cargo build --release -p electric-circuits-engine --features test-support
      - name: Run cold launch and steady-write repetitions
        env:
          REPS: 5
          PHONES: 30
          OTHER_USERS: 40
          HOLD_MS: 3000
          ONLY_CONFIG: 'scope group'
          ENGINE_BIN: ${{ github.workspace }}/target/release/electric-circuits-engine
        run: |
          set -uo pipefail
          mkdir -p packages/scope-bench/results/ci
          result=0
          for mode in subquery semijoin; do
            ELECTRIC_CIRCUITS_GROUP_MEMBERSHIP="$mode" \
              ONLY='cold launch' STEADY=0 \
              OUT="${{ github.workspace }}/packages/scope-bench/results/ci/${mode}-cold.json" \
              pnpm --filter @electric-circuits/scope-bench bench || result=1
            ELECTRIC_CIRCUITS_GROUP_MEMBERSHIP="$mode" \
              ONLY='chat open' STEADY=1 STEADY_WRITE_MS=500 \
              OUT="${{ github.workspace }}/packages/scope-bench/results/ci/${mode}-steady.json" \
              pnpm --filter @electric-circuits/scope-bench bench || result=1
          done
          exit "$result"
      - name: Upload benchmark measurements
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: semijoin-vs-subquery-${{ github.sha }}
          path: packages/scope-bench/results/ci/*.json
          if-no-files-found: error
