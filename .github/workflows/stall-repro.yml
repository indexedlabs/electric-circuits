name: stall-repro-scratch

on:
  push:
    branches: ['profile/stall-repro-2026-11-24']
    paths-ignore: ['tools/stall-repro/results/**', 'tools/stall-repro/README.md']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  experiment:
    if: contains(github.event.head_commit.message, '[smoke]') || contains(github.event.head_commit.message, '[measure]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]' psutil
      - uses: actions/download-artifact@v4
        with:
          name: stall-engine-d6f1b0a9fc1f437a357ac259eb13f436256bc937
          run-id: 45342910224
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - uses: actions/download-artifact@v4
        with:
          name: stall-stream-store
          run-id: 45347325335
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - name: Prepare disposable schema and machine evidence
        run: |
          chmod +x tools/stall-repro/bin/*
          python tools/stall-repro/export_fixture.py
          docker run -d --name stall-experiment-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          for attempt in $(seq 1 60); do
            if docker exec stall-experiment-pg pg_isready -U postgres -d stall_repro; then break; fi
            sleep 1
          done
          docker exec -i stall-experiment-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
          { date -u; git rev-parse HEAD; uname -a; lscpu; df -h; docker image inspect postgres:18; } > tools/stall-repro/results/fixture/experiment-machine.txt
      - name: Run isolated engine smoke or measurement
        env:
          SMOKE: ${{ contains(github.event.head_commit.message, '[smoke]') && '1' || '0' }}
        run: |
          ARGS=()
          if [ "$SMOKE" = 1 ]; then ARGS=(--smoke --timeout 120); fi
          python tools/stall-repro/run.py --engine tools/stall-repro/bin/electric-circuits-engine --store tools/stall-repro/bin/durable-streams-server --name run-nov24 --catalog nov24 "${ARGS[@]}"
      - name: Stop disposable database
        if: always()
        run: docker rm -f stall-experiment-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-experiment-${{ github.sha }}
          path: |
            tools/stall-repro/results/run-*/
            tools/stall-repro/results/fixture/
            !tools/stall-repro/results/run-*/store-data/**
            !tools/stall-repro/results/run-*/engine-data/**
  stream-store:
    if: contains(github.event.head_commit.message, '[store]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - run: cargo install durable-streams --version 0.1.5 --locked --root "$RUNNER_TEMP/stall-store"
      - uses: actions/upload-artifact@v4
        with:
          name: stall-stream-store
          path: ${{ runner.temp }}/stall-store/bin/durable-streams-server
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]'
      - run: python -m unittest discover -s tools/stall-repro -p 'test_*.py'
      - run: python tools/stall-repro/export_fixture.py
      - run: python tools/stall-repro/catalog.py
      - name: Apply exported schema to disposable PostgreSQL 18
        run: |
          docker run -d --name stall-schema-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical
          for attempt in $(seq 1 60); do
            if docker exec stall-schema-pg pg_isready -U postgres -d stall_repro; then break; fi
            sleep 1
          done
          docker exec -i stall-schema-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
          docker exec stall-schema-pg psql -U postgres -d stall_repro -c 'SELECT version()' -c '\dt' > tools/stall-repro/results/fixture/postgres-schema.txt
      - name: Validate synthetic writes without an engine
        run: python tools/stall-repro/data_smoke.py
        env:
          STALL_REPRO_PG_URL: postgresql://postgres:synthetic@127.0.0.1:55432/stall_repro
      - name: Clean up fixture database
        if: always()
        run: docker rm -f stall-schema-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-fixture-${{ github.sha }}
          path: tools/stall-repro/results/fixture/
  build:
    if: contains(github.event.head_commit.message, '[engine]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      RUSTFLAGS: '-C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v4
      - name: Isolated runner preflight
        run: |
          mkdir -p tools/stall-repro/results/preflight
          {
            date -u
            git rev-parse HEAD
            uname -a
            lscpu
            docker version
            sudo -n true
            cat /proc/sys/kernel/perf_event_paranoid
            docker run --rm --cpus=1 postgres:18 bash -c 'nproc; cat /sys/fs/cgroup/cpu.max; postgres --version'
          } 2>&1 | tee tools/stall-repro/results/preflight/machine.txt
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stall-repro-release-frame-pointers
      - uses: actions/cache@v4
        id: engine-binary
        with:
          path: target/release/electric-circuits-engine
          key: stall-prod-5b2cf3e-release-debug1-frame-pointers-v1
      - name: Build unmodified production engine with symbols
        if: steps.engine-binary.outputs.cache-hit != 'true'
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          cargo build --release --locked -p electric-circuits-engine
          sha256sum target/release/electric-circuits-engine | tee tools/stall-repro/results/preflight/binary.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-preflight-${{ github.sha }}
          path: tools/stall-repro/results/preflight/
      - uses: actions/upload-artifact@v4
        with:
          name: stall-engine-${{ github.sha }}
          path: target/release/electric-circuits-engine
