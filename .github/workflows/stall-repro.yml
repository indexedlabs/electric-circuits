name: stall-repro-scratch

on:
  push:
    branches: ['profile/stall-repro-2026-11-24']
    paths-ignore: ['tools/stall-repro/results/**', 'tools/stall-repro/README.md']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch-red:
    if: contains(github.event.head_commit.message, '[batch-red]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert batching contract against immutable pre-prototype engine evidence
        run: |
          mkdir -p tools/stall-repro/results/batch-red
          set +e
          python3 tools/stall-repro/check_membership_batch.py tools/stall-repro/results/observer-346e9f9/import-result.json > tools/stall-repro/results/batch-red/assertion.txt 2>&1
          status=$?
          set -e
          cat tools/stall-repro/results/batch-red/assertion.txt
          test "$status" = 1
          grep -q 'membership called 11941 times' tools/stall-repro/results/batch-red/assertion.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stall-batch-red-${{ github.sha }}
          path: tools/stall-repro/results/batch-red/
  historical-build:
    if: contains(github.event.head_commit.message, '[coalesced-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: ['1be10fb8313af3247c5dbc8b3190d355419c4c79', '3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606']
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      RUSTFLAGS: '-C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stall-repro-release-frame-pointers
      - name: Build exact historical source without porting it
        run: |
          git fetch origin refs/pull/68/head
          mkdir -p "$RUNNER_TEMP/historical-source" tools/stall-repro/results/historical-build
          git archive ${{ matrix.source }} | tar -x -C "$RUNNER_TEMP/historical-source"
          export CARGO_TARGET_DIR="$PWD/target"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/historical-source/Cargo.toml" -p electric-circuits-engine
          printf '%s\n' '${{ matrix.source }}' > tools/stall-repro/results/historical-build/source.txt
          sha256sum target/release/electric-circuits-engine > tools/stall-repro/results/historical-build/binary.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: stall-historical-engine-${{ matrix.source }}
          path: target/release/electric-circuits-engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-historical-build-${{ matrix.source }}
          path: tools/stall-repro/results/historical-build/
  observer-build:
    if: contains(github.event.head_commit.message, '[observe-build]') || contains(github.event.head_commit.message, '[bridges]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      RUSTFLAGS: '-C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stall-repro-release-frame-pointers
      - name: Compile observational binary and focused guard test
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          mkdir -p tools/stall-repro/results/observer-build
          git diff 5b2cf3e2731d7fcecc3f95b9c05a5963b9c6b363 HEAD -- apps/engine > tools/stall-repro/results/observer-build/source.diff
          cargo fmt --check > tools/stall-repro/results/observer-build/format.txt 2>&1 || true
          cargo build --release --locked -p electric-circuits-engine
          sha256sum target/release/electric-circuits-engine > tools/stall-repro/results/observer-build/binary.sha256
          cargo test --release --locked -p electric-circuits-engine --features test-support --lib stall_
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-observer-build-${{ github.sha }}
          path: tools/stall-repro/results/observer-build/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-observed-engine-${{ github.sha }}
          path: target/release/electric-circuits-engine
  experiment:
    # A [bridges] push builds the scratch binary first and measures it in the same run.
    needs: observer-build
    if: ${{ !cancelled() && needs.observer-build.result != 'failure' && (contains(github.event.head_commit.message, '[smoke]') || contains(github.event.head_commit.message, '[measure]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BRIDGE_BINARY: ${{ contains(github.event.head_commit.message, '[bridges]') && contains(fromJSON('["bridge-control","sampler-off","sampler-10x","yield-rows","commit-membership","commit-membership-slices"]'), matrix.variant) && '1' || '0' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ contains(github.event.head_commit.message, '[bridges]') && 13 || contains(github.event.head_commit.message, '[final-variants]') && 1 || 8 }}
      matrix:
        catalog: ${{ fromJSON((contains(github.event.head_commit.message, '[smoke]') || contains(github.event.head_commit.message, '[model-B]') || contains(github.event.head_commit.message, '[cpu-variants]') || contains(github.event.head_commit.message, '[cheap-variants]') || contains(github.event.head_commit.message, '[coalesced]') || contains(github.event.head_commit.message, '[final-variants]') || contains(github.event.head_commit.message, '[bridges]') || contains(github.event.head_commit.message, '[observe]')) && '["nov24"]' || '["nov23","nov24"]') }}
        variant: ${{ fromJSON(contains(github.event.head_commit.message, '[bridges]') && '["B-retained-key-chat","B-retained-key-edge","B-retained-key-resource","B-retained-key-file","B-retained-key-user","half-subqueries","plain-only","bridge-control","sampler-off","sampler-10x","yield-rows","commit-membership","commit-membership-slices"]' || contains(github.event.head_commit.message, '[model-B]') && '["B","B-retained"]' || contains(github.event.head_commit.message, '[cheap-variants]') && '["marker-bypass","A-observed"]' || contains(github.event.head_commit.message, '[coalesced]') && '["coalesced-base","coalesced-head"]' || contains(github.event.head_commit.message, '[final-variants]') && '["commit-membership","half-subqueries","plain-only"]' || contains(github.event.head_commit.message, '[observe]') && '["A-observed"]' || '["A"]') }}
        cpus: ${{ fromJSON(contains(github.event.head_commit.message, '[cpu-variants]') && '[2,4]' || '[1]') }}
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[cheap-variants]') && '[{"catalog":"nov24","variant":"A","cpus":2},{"catalog":"nov24","variant":"A","cpus":4}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]' psutil
      - name: Prepare CPU sampler
        if: contains(github.event.head_commit.message, '[profile]')
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          PERF=$(command -v perf)
          if ! "$PERF" --version; then
            PERF=$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)
          fi
          test -x "$PERF"
          echo "STALL_REPRO_PERF=$PERF" >> "$GITHUB_ENV"
          sudo "$PERF" stat -e cpu-clock -- true
      - uses: actions/download-artifact@v4
        if: env.BRIDGE_BINARY != '1' && matrix.variant != 'A-observed' && matrix.variant != 'marker-bypass' && matrix.variant != 'coalesced-base' && matrix.variant != 'coalesced-head' && matrix.variant != 'commit-membership'
        with:
          name: stall-engine-d6f1b0a9fc1f437a357ac259eb13f436256bc937
          run-id: 45342910224
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - uses: actions/download-artifact@v4
        if: env.BRIDGE_BINARY == '1'
        with:
          name: stall-observed-engine-${{ github.sha }}
          path: tools/stall-repro/bin
      - uses: actions/download-artifact@v4
        if: env.BRIDGE_BINARY != '1' && matrix.variant == 'commit-membership'
        with:
          name: stall-observed-engine-0bdc7a2f6e5614f87246b66534a786c5aea792b6
          run-id: 45363678502
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'coalesced-base' || matrix.variant == 'coalesced-head'
        with:
          name: ${{ matrix.variant == 'coalesced-base' && 'stall-historical-engine-1be10fb8313af3247c5dbc8b3190d355419c4c79' || 'stall-historical-engine-3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606' }}
          run-id: 45362388808
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'A-observed' || matrix.variant == 'marker-bypass'
        with:
          name: ${{ contains(github.event.head_commit.message, '[observe]') && 'stall-observed-engine-894b2cca2ec9c1ba547e130e275159c61e178e59' || 'stall-observed-engine-cbb6156a1c20de49e9175e895acb2cec75286a57' }}
          run-id: ${{ contains(github.event.head_commit.message, '[observe]') && '45358360702' || '45359671720' }}
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - uses: actions/download-artifact@v4
        with:
          name: stall-stream-store
          run-id: 45347325335
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - name: Prepare disposable schema and machine evidence
        run: |
          chmod +x tools/stall-repro/bin/*
          python tools/stall-repro/export_fixture.py
          docker run -d --name stall-experiment-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          for attempt in $(seq 1 60); do
            if docker exec stall-experiment-pg pg_isready -h 127.0.0.1 -U postgres -d stall_repro; then break; fi
            sleep 1
          done
          docker exec -i stall-experiment-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
          { date -u; git rev-parse HEAD; uname -a; lscpu; df -h; docker image inspect postgres:18; } > tools/stall-repro/results/fixture/experiment-machine.txt
      - name: Start isolated driver and retain catalog checkpoint
        env:
          SMOKE: ${{ contains(github.event.head_commit.message, '[smoke]') && '1' || '0' }}
          CALIBRATE: ${{ contains(github.event.head_commit.message, '[calibrate]') && '1' || '0' }}
          OBSERVE: ${{ contains(github.event.head_commit.message, '[observe]') && '1' || '0' }}
        run: |
          ARGS=()
          if [ "$SMOKE" = 1 ]; then ARGS=(--smoke --timeout 120); fi
          if [ "$CALIBRATE" = 1 ]; then ARGS+=(--calibrate-only); fi
          if [ "$OBSERVE" = 1 ]; then ARGS+=(--workloads import --engine-source 894b2cca2ec9c1ba547e130e275159c61e178e59); fi
          if [ "$OBSERVE" != 1 ] && { [ '${{ matrix.variant }}' = A-observed ] || [ '${{ matrix.variant }}' = marker-bypass ]; }; then ARGS+=(--engine-source cbb6156a1c20de49e9175e895acb2cec75286a57); fi
          if [ '${{ matrix.variant }}' = coalesced-base ]; then ARGS+=(--engine-source 1be10fb8313af3247c5dbc8b3190d355419c4c79); fi
          if [ '${{ matrix.variant }}' = coalesced-head ]; then ARGS+=(--engine-source 3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606); fi
          if [ "$BRIDGE_BINARY" = 1 ]; then ARGS+=(--engine-source ${{ github.sha }}); elif [ '${{ matrix.variant }}' = commit-membership ]; then ARGS+=(--engine-source 0bdc7a2f6e5614f87246b66534a786c5aea792b6); fi
          nohup bash -c 'set +e; python "$@"; echo "$?" > "$RUNNER_TEMP/stall-driver-exit"' _ tools/stall-repro/run.py --engine tools/stall-repro/bin/electric-circuits-engine --store tools/stall-repro/bin/durable-streams-server --name run-${{ matrix.variant }}-${{ matrix.catalog }}-${{ matrix.cpus }}cpu --catalog ${{ matrix.catalog }} --variant ${{ matrix.variant }} --cpus ${{ matrix.cpus }} "${ARGS[@]}" > "$RUNNER_TEMP/stall-driver.log" 2>&1 &
          while ! test -f tools/stall-repro/results/run-${{ matrix.variant }}-${{ matrix.catalog }}-${{ matrix.cpus }}cpu/catalog-before-warmup.json; do
            if test -f "$RUNNER_TEMP/stall-driver-exit"; then cat "$RUNNER_TEMP/stall-driver.log"; exit "$(cat "$RUNNER_TEMP/stall-driver-exit")"; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/stall-driver.log"
      - uses: actions/upload-artifact@v4
        with:
          name: stall-checkpoint-${{ matrix.variant }}-${{ matrix.catalog }}-${{ matrix.cpus }}cpu-${{ github.sha }}
          path: |
            tools/stall-repro/results/run-*/catalog-before-warmup.json
            tools/stall-repro/results/run-*/manifest.json
            tools/stall-repro/results/run-*/store-config.json
            tools/stall-repro/results/run-*/engine-threads-at-ready.json
            tools/stall-repro/results/fixture/experiment-machine.txt
      - name: Await driver completion
        run: |
          while ! test -f "$RUNNER_TEMP/stall-driver-exit"; do sleep 5; done
          cat "$RUNNER_TEMP/stall-driver.log"
          status=$(cat "$RUNNER_TEMP/stall-driver-exit")
          if [ "$status" != 0 ]; then exit "$status"; fi
          if [ '${{ matrix.variant }}' = commit-membership ]; then
            for result in tools/stall-repro/results/run-commit-membership-nov24-*/*-result.json; do
              python tools/stall-repro/check_membership_batch.py "$result" | tee "${result%-result.json}-batch-check.txt"
            done
          fi
      - name: Stop disposable database
        if: always()
        run: |
          cp "$RUNNER_TEMP/stall-driver.log" tools/stall-repro/results/fixture/driver.log || true
          docker rm -f stall-experiment-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-experiment-${{ matrix.variant }}-${{ matrix.catalog }}-${{ matrix.cpus }}cpu-${{ github.sha }}
          path: |
            tools/stall-repro/results/run-*/
            tools/stall-repro/results/fixture/
            !tools/stall-repro/results/run-*/store-data/**
            !tools/stall-repro/results/run-*/engine-data/**
  paired:
    # Control and variants run back to back on ONE runner, each on a fresh database, because
    # hosted runners differ by CPU model (EPYC 7763/9V45/9V74, Xeon 8370C/8573C/6975P-C) and
    # cross-runner ratios mostly measure the CPU.
    if: contains(github.event.head_commit.message, '[paired]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - {pair: noise, runs: 'A:prod:1 A:prod:1'}
          - {pair: cpu2, runs: 'A:prod:1 A:prod:2'}
          - {pair: binary, runs: 'A:prod:1 bridge-control:bridge:1'}
          - {pair: sampler-off, runs: 'A:prod:1 sampler-off:bridge:1'}
          - {pair: sampler-10x, runs: 'A:prod:1 sampler-10x:bridge:1'}
          - {pair: yield, runs: 'A:prod:1 yield-rows:bridge:1'}
          - {pair: commit, runs: 'A:prod:1 commit-membership-slices:bridge:1 commit-membership:bridge:1'}
          - {pair: marker, runs: 'A:prod:1 marker-bypass:bridge:1'}
          - {pair: half, runs: 'A:prod:1 half-subqueries:prod:1'}
          - {pair: pr68, runs: 'coalesced-base:base:1 coalesced-head:head:1 A:prod:1'}
          - {pair: retained, runs: 'B-retained:prod:1 B-retained-key-edge:prod:1 B-retained-key-chat:prod:1 B-retained-key-resource:prod:1 B-retained-key-file:prod:1 B-retained-key-user:prod:1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]' psutil
      - uses: actions/download-artifact@v4
        with:
          name: stall-engine-d6f1b0a9fc1f437a357ac259eb13f436256bc937
          run-id: 45342910224
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/prod
      - uses: actions/download-artifact@v4
        with:
          name: stall-observed-engine-caf9e2d3db42e87f6f885f2eca4632dfad51a942
          run-id: 45372211215
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/bridge
      - uses: actions/download-artifact@v4
        with:
          name: stall-historical-engine-1be10fb8313af3247c5dbc8b3190d355419c4c79
          run-id: 45362388808
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/base
      - uses: actions/download-artifact@v4
        with:
          name: stall-historical-engine-3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606
          run-id: 45362388808
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/head
      - uses: actions/download-artifact@v4
        with:
          name: stall-stream-store
          run-id: 45347325335
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - name: Run each measurement on this runner with a fresh database
        run: |
          chmod +x tools/stall-repro/bin/*/electric-circuits-engine tools/stall-repro/bin/durable-streams-server
          python tools/stall-repro/export_fixture.py
          mkdir -p tools/stall-repro/results/fixture
          { date -u; git rev-parse HEAD; uname -a; lscpu; } > tools/stall-repro/results/fixture/experiment-machine.txt
          declare -A SOURCE=([prod]=5b2cf3e2731d7fcecc3f95b9c05a5963b9c6b363 [bridge]=caf9e2d3db42e87f6f885f2eca4632dfad51a942 [base]=1be10fb8313af3247c5dbc8b3190d355419c4c79 [head]=3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606)
          index=0
          for spec in ${{ matrix.runs }}; do
            IFS=: read -r variant binary cpus <<< "$spec"
            index=$((index + 1))
            label="paired-${{ matrix.pair }}-$index-$variant-${cpus}cpu"
            docker rm -f stall-experiment-pg >/dev/null 2>&1 || true
            docker run -d --name stall-experiment-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
            for attempt in $(seq 1 60); do
              if docker exec stall-experiment-pg pg_isready -h 127.0.0.1 -U postgres -d stall_repro; then break; fi
              sleep 1
            done
            sleep 3
            docker exec -i stall-experiment-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
            echo "::group::$label"
            python tools/stall-repro/run.py --engine tools/stall-repro/bin/$binary/electric-circuits-engine --store tools/stall-repro/bin/durable-streams-server --name "run-$label" --label "$label" --catalog nov24 --variant "$variant" --cpus "$cpus" --engine-source "${SOURCE[$binary]}" > "tools/stall-repro/results/$label.driver.log" 2>&1 || echo "$label failed with $?"
            tail -5 "tools/stall-repro/results/$label.driver.log"
            echo "::endgroup::"
          done
          docker rm -f stall-experiment-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-experiment-paired-${{ matrix.pair }}-${{ github.sha }}
          path: |
            tools/stall-repro/results/run-*/
            tools/stall-repro/results/*.driver.log
            tools/stall-repro/results/fixture/
            !tools/stall-repro/results/run-*/store-data/**
            !tools/stall-repro/results/run-*/engine-data/**
  stream-store:
    if: contains(github.event.head_commit.message, '[store]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - run: cargo install durable-streams --version 0.1.5 --locked --root "$RUNNER_TEMP/stall-store"
      - uses: actions/upload-artifact@v4
        with:
          name: stall-stream-store
          path: ${{ runner.temp }}/stall-store/bin/durable-streams-server
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]'
      - run: python -m unittest discover -s tools/stall-repro -p 'test_*.py'
      - run: python tools/stall-repro/export_fixture.py
      - run: python tools/stall-repro/catalog.py
      - name: Apply exported schema to disposable PostgreSQL 18
        run: |
          docker run -d --name stall-schema-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical
          for attempt in $(seq 1 60); do
            if docker exec stall-schema-pg pg_isready -h 127.0.0.1 -U postgres -d stall_repro; then break; fi
            sleep 1
          done
          docker exec -i stall-schema-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
          docker exec stall-schema-pg psql -U postgres -d stall_repro -c 'SELECT version()' -c '\dt' > tools/stall-repro/results/fixture/postgres-schema.txt
      - name: Validate synthetic writes without an engine
        run: python tools/stall-repro/data_smoke.py
        env:
          STALL_REPRO_PG_URL: postgresql://postgres:synthetic@127.0.0.1:55432/stall_repro
      - name: Clean up fixture database
        if: always()
        run: docker rm -f stall-schema-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-fixture-${{ github.sha }}
          path: tools/stall-repro/results/fixture/
  build:
    if: contains(github.event.head_commit.message, '[engine]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      RUSTFLAGS: '-C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolated runner preflight
        run: |
          mkdir -p tools/stall-repro/results/preflight
          {
            date -u
            git rev-parse HEAD
