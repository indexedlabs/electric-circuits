    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]' psutil
      - uses: actions/download-artifact@v4
        with:
          name: stall-engine-d6f1b0a9fc1f437a357ac259eb13f436256bc937
          run-id: 45342910224
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/prod
      - uses: actions/download-artifact@v4
        with:
          name: stall-observed-engine-caf9e2d3db42e87f6f885f2eca4632dfad51a942
          run-id: 45372211215
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/bridge
      - uses: actions/download-artifact@v4
        with:
          name: stall-historical-engine-1be10fb8313af3247c5dbc8b3190d355419c4c79
          run-id: 45362388808
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/base
      - uses: actions/download-artifact@v4
        with:
          name: stall-historical-engine-3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606
          run-id: 45362388808
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/head
      - uses: actions/download-artifact@v4
        with:
          name: stall-stream-store
          run-id: 45347325335
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin
      - name: Prepare CPU sampler for runs marked perf
        if: contains(matrix.runs, ':perf')
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          PERF=$(command -v perf)
          if ! "$PERF" --version; then
            PERF=$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)
          fi
          test -x "$PERF"
          echo "STALL_REPRO_PERF_BINARY=$PERF" >> "$GITHUB_ENV"
          sudo "$PERF" stat -e cpu-clock -- true
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[bisect-build]') || contains(github.event.head_commit.message, '[prod-build]')
        with:
          pattern: stall-historical-engine-*
          path: tools/stall-repro/bin/hist
      - uses: actions/download-artifact@v4
        if: ${{ !contains(github.event.head_commit.message, '[prod-build]') }}
        with:
          name: stall-historical-engine-9bc1563f5718db7bc502eeb79388ee189f1fd5f9
          run-id: 45850851465
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/hist/stall-historical-engine-9bc1563f5718db7bc502eeb79388ee189f1fd5f9
      - uses: actions/download-artifact@v4
        if: ${{ !contains(github.event.head_commit.message, '[bisect-build]') }}
        with:
          pattern: stall-historical-engine-*
          run-id: 45388936382
          github-token: ${{ github.token }}
          path: tools/stall-repro/bin/hist
      - name: Run each measurement on this runner with a fresh database
        run: |
          for pair in prod9bc:9bc1563f5718db7bc502eeb79388ee189f1fd5f9 pr70:e10c4bd893e7ed847aa269195fa9ef34d8daf8c1 pr71:a248886e86bf39147458b3607460d6eed01f1497 pr69:b42f70d0b1489dd72feb7b5f2ee8ae71259bb169; do
            if [ -d "tools/stall-repro/bin/hist/stall-historical-engine-${pair#*:}" ]; then
              mkdir -p "tools/stall-repro/bin/${pair%%:*}"
              cp "tools/stall-repro/bin/hist/stall-historical-engine-${pair#*:}/electric-circuits-engine" "tools/stall-repro/bin/${pair%%:*}/"
            fi
          done
          chmod +x tools/stall-repro/bin/*/electric-circuits-engine tools/stall-repro/bin/durable-streams-server
          python tools/stall-repro/export_fixture.py
          mkdir -p tools/stall-repro/results/fixture
          { date -u; git rev-parse HEAD; uname -a; lscpu; } > tools/stall-repro/results/fixture/experiment-machine.txt
          declare -A SOURCE=([prod]=5b2cf3e2731d7fcecc3f95b9c05a5963b9c6b363 [bridge]=caf9e2d3db42e87f6f885f2eca4632dfad51a942 [base]=1be10fb8313af3247c5dbc8b3190d355419c4c79 [head]=3a0ce4047e1f5a2ad3ea2712f64ff9c06bcee606 [pr70]=e10c4bd893e7ed847aa269195fa9ef34d8daf8c1 [pr71]=a248886e86bf39147458b3607460d6eed01f1497 [pr69]=b42f70d0b1489dd72feb7b5f2ee8ae71259bb169 [prod9bc]=9bc1563f5718db7bc502eeb79388ee189f1fd5f9)
          index=0
          for spec in ${{ matrix.runs }}; do
            IFS=: read -r variant binary cpus workloads profile <<< "$spec"
            if [ "$profile" = perf ]; then export STALL_REPRO_PERF="$STALL_REPRO_PERF_BINARY"; else unset STALL_REPRO_PERF; fi
            index=$((index + 1))
            label="paired-${{ matrix.pair }}-$index-$variant-$binary-${cpus}cpu"
            WORKLOAD_ARGS=()
            if [ -n "$workloads" ]; then WORKLOAD_ARGS=(--workloads ${workloads//,/ }); fi
            # S-main3 reads indexed main's gateway and schema (52e79b8); every other variant the pinned source.
            git checkout -- tools/stall-repro/indexed-source.json.gz
            case "$variant" in S-main3*) cp tools/stall-repro/indexed-source-52e79b8.json.gz tools/stall-repro/indexed-source.json.gz ;; esac
            python tools/stall-repro/export_fixture.py > /dev/null
            docker rm -f stall-experiment-pg >/dev/null 2>&1 || true
            docker run -d --name stall-experiment-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
            for attempt in $(seq 1 60); do
              if docker exec stall-experiment-pg pg_isready -h 127.0.0.1 -U postgres -d stall_repro; then break; fi
              sleep 1
            done
            sleep 3
            docker exec -i stall-experiment-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
            echo "::group::$label"
            python tools/stall-repro/run.py --engine tools/stall-repro/bin/$binary/electric-circuits-engine --store tools/stall-repro/bin/durable-streams-server --name "run-$label" --label "$label" --catalog nov24 --variant "$variant" --cpus "$cpus" --engine-source "${SOURCE[$binary]}" "${WORKLOAD_ARGS[@]}" > "tools/stall-repro/results/$label.driver.log" 2>&1 || echo "$label failed with $?"
            tail -5 "tools/stall-repro/results/$label.driver.log"
            echo "::endgroup::"
          done
          docker rm -f stall-experiment-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-experiment-paired-${{ matrix.pair }}-${{ github.sha }}
          path: |
            tools/stall-repro/results/run-*/
            tools/stall-repro/results/*.driver.log
            tools/stall-repro/results/fixture/
            !tools/stall-repro/results/run-*/store-data/**
            !tools/stall-repro/results/run-*/engine-data/**
  parity:
    # Variant S against today's gateway predicates, in one snapshot of the synthetic database; no engine.
    if: contains(github.event.head_commit.message, '[parity]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]'
      - run: python tools/stall-repro/export_fixture.py
      - name: Compare variant S with today's gateway predicates
        env:
          STALL_REPRO_PG_URL: postgresql://postgres:synthetic@127.0.0.1:55432/stall_repro
        run: |
          docker run -d --name stall-parity-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18
          for attempt in $(seq 1 60); do
            if docker exec stall-parity-pg pg_isready -h 127.0.0.1 -U postgres -d stall_repro; then break; fi
            sleep 1
          done
          sleep 3
          docker exec -i stall-parity-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql > /dev/null
          python tools/stall-repro/parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-fixture-parity-${{ github.sha }}
          path: tools/stall-repro/results/simple-keys/parity/
  stream-store:
    if: contains(github.event.head_commit.message, '[store]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - run: cargo install durable-streams --version 0.1.5 --locked --root "$RUNNER_TEMP/stall-store"
      - uses: actions/upload-artifact@v4
        with:
          name: stall-stream-store
          path: ${{ runner.temp }}/stall-store/bin/durable-streams-server
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'sqlalchemy==2.0.44' sqlalchemy-utils passlib 'pydantic>=2.11,<3' whenever fastapi logfire uuid-utils pgvector httpx 'psycopg[binary]'
      - run: python -m unittest discover -s tools/stall-repro -p 'test_*.py'
      - run: python tools/stall-repro/export_fixture.py
      - run: python tools/stall-repro/catalog.py
      - name: Apply exported schema to disposable PostgreSQL 18
        run: |
          docker run -d --name stall-schema-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic -e POSTGRES_DB=stall_repro postgres:18 -c wal_level=logical
          for attempt in $(seq 1 60); do
            if docker exec stall-schema-pg pg_isready -h 127.0.0.1 -U postgres -d stall_repro; then break; fi
            sleep 1
          done
          docker exec -i stall-schema-pg psql -v ON_ERROR_STOP=1 -U postgres -d stall_repro < tools/stall-repro/results/fixture/schema.sql
          docker exec stall-schema-pg psql -U postgres -d stall_repro -c 'SELECT version()' -c '\dt' > tools/stall-repro/results/fixture/postgres-schema.txt
      - name: Validate synthetic writes without an engine
        run: python tools/stall-repro/data_smoke.py
        env:
          STALL_REPRO_PG_URL: postgresql://postgres:synthetic@127.0.0.1:55432/stall_repro
      - name: Clean up fixture database
        if: always()
        run: docker rm -f stall-schema-pg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-fixture-${{ github.sha }}
          path: tools/stall-repro/results/fixture/
  build:
    if: contains(github.event.head_commit.message, '[engine]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      RUSTFLAGS: '-C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolated runner preflight
        run: |
          mkdir -p tools/stall-repro/results/preflight
          {
            date -u
            git rev-parse HEAD
            uname -a
            lscpu
            docker version
            sudo -n true
            cat /proc/sys/kernel/perf_event_paranoid
            docker run --rm --cpus=1 postgres:18 bash -c 'nproc; cat /sys/fs/cgroup/cpu.max; postgres --version'
          } 2>&1 | tee tools/stall-repro/results/preflight/machine.txt
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stall-repro-release-frame-pointers
      - uses: actions/cache@v4
        id: engine-binary
        with:
          path: target/release/electric-circuits-engine
          key: stall-prod-5b2cf3e-release-debug1-frame-pointers-v1
      - name: Build unmodified production engine with symbols
        if: steps.engine-binary.outputs.cache-hit != 'true'
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          mkdir -p "$RUNNER_TEMP/prod-engine-source"
          git archive 5b2cf3e2731d7fcecc3f95b9c05a5963b9c6b363 | tar -x -C "$RUNNER_TEMP/prod-engine-source"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/prod-engine-source/Cargo.toml" -p electric-circuits-engine
          sha256sum target/release/electric-circuits-engine | tee tools/stall-repro/results/preflight/binary.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-preflight-${{ github.sha }}
          path: tools/stall-repro/results/preflight/
      - uses: actions/upload-artifact@v4
        with:
          name: stall-engine-${{ github.sha }}
          path: target/release/electric-circuits-engine
